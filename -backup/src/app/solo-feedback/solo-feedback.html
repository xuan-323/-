<div class="page">
  <h1 class="title">用餐回饋</h1>
  <p class="subtitle">今天在 {{ restaurant.name }} 用餐感覺如何？</p>

  <div class="card">
    <div class="stars">
      <button
        class="star"
        *ngFor="let s of [1,2,3,4,5]"
        (click)="setRating(s)"
        [class.active]="s <= rating"
      >
        ★
      </button>
    </div>

    <textarea
      [(ngModel)]="comment"
      rows="4"
      placeholder="想說的話（可不填）"
    ></textarea>

    <button class="submit-btn" (click)="submit()" [disabled]="rating===0">
      送出回饋
    </button>
  </div>
</div>
