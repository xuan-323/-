<div class="page">

  <h1 class="title">🍽️ 食伴配對</h1>

  <div class="grid">

    <div class="card" *ngFor="let user of users">

      <!-- 頭像 -->
      <img
        class="avatar"
        [src]="getAvatar(user.profiles?.avatar_url, user.profiles?.username)"
      />

      <!-- 名字 -->
      <p class="username">
        {{ user.profiles?.username || '使用者' }}
      </p>

      <!-- 未配對 -->
      <button 
        *ngIf="!isMatched(user)"
        class="like"
        (click)="likeUser(user)">
        👍 喜歡
      </button>

      <!-- 已配對 -->
      <button 
        *ngIf="isMatched(user)"
        class="chat"
        (click)="goChat(user)">
        💬 開始聊天
      </button>

    </div>

  </div>

</div>
