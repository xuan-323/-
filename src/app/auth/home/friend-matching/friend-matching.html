<div class="page">

  <h1 class="title">🍽️ 食伴配對</h1>

  <div class="grid">

    <div class="card" *ngFor="let user of users">

      <div class="avatar">👤</div>

      <p>{{ user.user_id }}</p>

      <!-- 未按 -->
      <button 
        *ngIf="!hasLiked(user)"
        class="like"
        (click)="likeUser(user)">
        👍 喜歡
      </button>

      <!-- 已按 -->
      <button 
        *ngIf="hasLiked(user)"
        class="chat"
        (click)="goChat(user)">
        💬 開始聊天
      </button>

    </div>

  </div>

</div>
