<div class="relative flex min-h-screen w-full flex-col items-center overflow-x-hidden">
  <div class="flex h-full w-full max-w-[480px] flex-col bg-background-light dark:bg-background-dark shadow-2xl min-h-screen relative">

    <!-- Header Nav -->
    <header class="sticky top-0 z-10 flex items-center justify-between bg-background-light/90 dark:bg-background-dark/90 px-4 py-3 backdrop-blur-md">
      <button
        class="flex h-10 w-10 items-center justify-center rounded-full text-text-main dark:text-white hover:bg-black/5 dark:hover:bg-white/5 transition"
        (click)="goBack()"
      >
        <span class="material-symbols-outlined">arrow_back</span>
      </button>

      <h1 class="text-lg font-bold tracking-tight text-text-main dark:text-white">
        個人資料設定
      </h1>

      <button class="flex h-10 w-10 items-center justify-center rounded-full text-text-main dark:text-white hover:bg-black/5 dark:hover:bg-white/5 transition">
        <span class="material-symbols-outlined">more_vert</span>
      </button>
    </header>

    <!-- Cover -->
    <div class="w-full h-40 bg-[#fff8f0] dark:bg-[#2c241b] flex items-center justify-center overflow-hidden relative">
      <img
        class="h-full w-full object-cover object-center opacity-90"
        [src]="coverUrl"
      />
    </div>

    <main class="flex-1 px-5 pb-32 -mt-4">

      <!-- Avatar -->
      <div class="flex flex-col items-center mb-6">
        <div class="h-28 w-28 rounded-full border-[5px] border-black shadow-lg overflow-hidden bg-white z-[2]">
          <img class="h-full w-full object-cover" [src]="avatarUrl" />
        </div>

        <!-- 系統提供頭像 -->
        <div class="mt-5 grid grid-cols-6 gap-2">
          <button
            *ngFor="let avatar of avatarOptions"
            type="button"
            class="h-12 w-12 overflow-hidden rounded-full border-2 bg-white shadow-sm transition hover:scale-105"
            [class.border-black]="avatarUrl === avatar"
            [class.ring-2]="avatarUrl === avatar"
            [class.ring-[#f27f0d]]="avatarUrl === avatar"
            [class.border-white]="avatarUrl !== avatar"
            (click)="selectAvatar(avatar)"
          >
            <img class="h-full w-full object-cover" [src]="avatar" />
          </button>
        </div>
      </div>

      <!-- Cover Options -->
      <div class="mb-6">
        <label class="mb-2 block text-sm font-bold text-[#3b2f2f]">
          封面背景 Cover
        </label>

        <div class="flex gap-2 overflow-x-auto pb-2">
          <button
            *ngFor="let cover of coverOptions"
            type="button"
            class="h-16 min-w-[88px] overflow-hidden rounded-xl border-2 bg-white shadow-sm transition hover:scale-105"
            [class.border-black]="coverUrl === cover"
            [class.ring-2]="coverUrl === cover"
            [class.ring-[#f27f0d]]="coverUrl === cover"
            [class.border-white]="coverUrl !== cover"
            (click)="selectCover(cover)"
          >
            <img class="h-full w-full object-cover" [src]="cover" />
          </button>
        </div>
      </div>

      <!-- Username -->
      <div class="flex flex-col gap-2 mb-6">
        <label class="text-sm font-bold text-[#3b2f2f]">暱稱 Username</label>
        <input
          class="w-full rounded-xl bg-white py-3.5 pl-4 pr-10 text-[#2f2a28] shadow-sm ring-1 ring-inset ring-[#e6e0db] focus:outline-none focus:ring-2 focus:ring-[#f27f0d]"
          [(ngModel)]="username"
        />
      </div>

      <!-- Gender -->
      <div class="flex flex-col gap-2 mb-6">
        <label class="text-sm font-bold text-[#3b2f2f]">性別 Gender</label>
        <div class="flex gap-3">
          <label class="flex-1 cursor-pointer">
            <input class="sr-only peer" type="radio" value="male" [(ngModel)]="gender" />
            <div class="h-11 flex items-center justify-center rounded-xl bg-white text-[#6f625d] font-bold shadow-sm ring-1 ring-[#e6e0db] peer-checked:bg-[#f27f0d] peer-checked:text-white peer-checked:ring-[#f27f0d]">
              男性
            </div>
          </label>

          <label class="flex-1 cursor-pointer">
            <input class="sr-only peer" type="radio" value="female" [(ngModel)]="gender" />
            <div class="h-11 flex items-center justify-center rounded-xl bg-white text-[#6f625d] font-bold shadow-sm ring-1 ring-[#e6e0db] peer-checked:bg-[#f27f0d] peer-checked:text-white peer-checked:ring-[#f27f0d]">
              女性
            </div>
          </label>

          <label class="flex-1 cursor-pointer">
            <input class="sr-only peer" type="radio" value="secret" [(ngModel)]="gender" />
            <div class="h-11 flex items-center justify-center rounded-xl bg-white text-[#6f625d] font-bold shadow-sm ring-1 ring-[#e6e0db] peer-checked:bg-[#f27f0d] peer-checked:text-white peer-checked:ring-[#f27f0d]">
              保密
            </div>
          </label>
        </div>
      </div>

      <!-- Bio -->
      <div class="flex flex-col gap-2">
        <label class="text-sm font-bold text-[#3b2f2f]">關於我 About Me</label>
        <textarea
          class="w-full rounded-xl bg-white py-3 px-4 text-[#2f2a28] shadow-sm ring-1 ring-inset ring-[#e6e0db] focus:outline-none focus:ring-2 focus:ring-[#f27f0d]"
          rows="3"
          [(ngModel)]="bio"
        ></textarea>
      </div>

    </main>

    <!-- Save -->
    <div class="fixed bottom-5 left-1/2 z-20 w-full max-w-[480px] -translate-x-1/2 px-5">
      <button
        class="w-full rounded-2xl bg-[#f27f0d] py-4 text-white font-bold shadow-lg shadow-orange-200 transition hover:bg-[#df7208] active:scale-[0.98]"
        (click)="saveProfile()"
      >
        儲存變更 Save Changes
      </button>
    </div>

  </div>
</div>
