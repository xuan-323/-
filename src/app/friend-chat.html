<div class="chat-wrapper">

  <!-- header -->
  <div class="chat-header">
    <div class="avatar">👤</div>
    <div class="name">聊天室</div>
  </div>

  <!-- 訊息區 -->
  <div class="chat-body" #scrollMe>

    <div *ngFor="let msg of messages; trackBy: trackById"
      [ngClass]="msg.sender_id === currentUser.id ? 'msg me' : 'msg other'">

      <!-- 對方頭像 -->
      <div class="avatar" *ngIf="msg.sender_id !== currentUser.id">👤</div>

      <div class="bubble">
        <div class="text">{{ msg.content }}</div>
        <div class="time">
          {{ msg.created_at | date:'HH:mm' }}
        </div>
      </div>

    </div>

  </div>

  <!-- 輸入區 -->
  <div class="chat-input">

    <div class="emoji-bar">
      <span (click)="addEmoji('😊')">😊</span>
      <span (click)="addEmoji('😂')">😂</span>
      <span (click)="addEmoji('❤️')">❤️</span>
      <span (click)="addEmoji('👍')">👍</span>
    </div>

    <div class="input-row">
      <input [(ngModel)]="newMessage" placeholder="輸入訊息..." />
      <button (click)="sendMessage()">送出</button>
    </div>

  </div>

</div>
