<div class="app-container">
  <router-outlet></router-outlet>

  <!-- 只在聊天室頁顯示 -->
  <ng-container *ngIf="showChatFloatingButtons">

    <!-- 歷史紀錄 -->
    <button class="history-fab" (click)="goToHistory()" aria-label="history">
      📜

    <!-- 聊天 -->
    <button class="chat-fab" (click)="goToChat()" aria-label="chat">
      💬
    </button>

  </ng-container>
</div>
